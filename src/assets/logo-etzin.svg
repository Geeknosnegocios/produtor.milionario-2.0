<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 40 40" shape-rendering="crispEdges" role="img" aria-label="Produtor Milionario 2.0">
  <defs>
    <linearGradient id="pmGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#60A5FA"/>
      <stop offset="100%" stop-color="#3B82F6"/>
    </linearGradient>
    <filter id="pmGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="0.4" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <!-- rounded square gradient bg -->
  <rect width="40" height="40" rx="8" fill="url(#pmGrad)"/>
  <rect x="0.5" y="0.5" width="39" height="39" rx="7.5" fill="none" stroke="rgba(96,165,250,0.5)" stroke-width="1"/>

  <!-- ETzin alien · 8x8 grid scaled 3x · centered (8px margin · 24x24 art) -->
  <g transform="translate(8, 8)" fill="#ffffff" filter="url(#pmGlow)">
    <rect x="6" y="0" width="12" height="3"/>
    <rect x="3" y="3" width="3" height="3"/><rect x="9" y="3" width="6" height="3"/><rect x="18" y="3" width="3" height="3"/>
    <rect x="3" y="6" width="18" height="3"/>
    <rect x="0" y="9" width="3" height="3"/><rect x="6" y="9" width="3" height="3"/><rect x="15" y="9" width="3" height="3"/><rect x="21" y="9" width="3" height="3"/>
    <rect x="0" y="12" width="24" height="3"/>
    <rect x="3" y="15" width="3" height="3"/><rect x="9" y="15" width="6" height="3"/><rect x="18" y="15" width="3" height="3"/>
    <rect x="3" y="18" width="6" height="3"/><rect x="15" y="18" width="6" height="3"/>
    <rect x="0" y="21" width="3" height="3"/><rect x="6" y="21" width="3" height="3"/><rect x="15" y="21" width="3" height="3"/><rect x="21" y="21" width="3" height="3"/>
  </g>
</svg>
